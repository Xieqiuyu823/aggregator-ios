name: Publish existing IPA
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 43023682073 --name AggregatorApp-unsigned --dir release
          echo 'fe14d5be38299c45cbefb1bb7be6e345819bc395e0d154aed92f4643aa8c4693  release/AggregatorApp-unsigned.ipa' | sha256sum -c -
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.0-unsigned release/AggregatorApp-unsigned.ipa \
            --target af3fdacf7044b45418191b560630fe54715beb35 \
            --title 'Aggregator iOS 1.0.0（未签名）' \
            --notes '未签名 IPA，需要使用有效证书重新签名后安装。使用前请按 README 配置 GitHub Actions。'
